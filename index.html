<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON SNAKE // CYBERPUNK PROTOCOL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --neon-pink: #ff00ff;
    --neon-cyan: #00ffff;
    --neon-green: #39ff14;
    --neon-yellow: #fff700;
    --neon-purple: #bc13fe;
    --neon-orange: #ff6600;
    --dark-bg: #050505;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    background: var(--dark-bg);
    color: var(--neon-cyan);
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }

  .crt::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    background-size: 100% 2px, 3px 100%;
    z-index: 100; pointer-events: none;
    animation: flicker 0.15s infinite;
  }

  .crt::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
    z-index: 101; pointer-events: none;
  }

  @keyframes flicker { 0% { opacity: 0.97; } 50% { opacity: 1; } 100% { opacity: 0.98; } }

  #game-container {
    position: relative;
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), inset 0 0 20px rgba(0,255,255,0.1);
    border-radius: 4px;
    background: rgba(5, 5, 5, 0.9);
  }

  canvas { display: block; image-rendering: pixelated; }

  #hud {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    text-shadow: 0 0 5px var(--neon-cyan);
    z-index: 10; pointer-events: none;
  }

  #hud .label { color: var(--neon-pink); }
  #hud .value { color: var(--neon-yellow); }

  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 5, 5, 0.92);
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  .screen.hidden { display: none; }

  .screen h1 {
    font-size: 24px; margin-bottom: 20px;
    text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
    color: var(--neon-pink);
    line-height: 1.5;
  }
  .screen p {
    font-size: 10px; margin: 8px 0;
    color: var(--neon-cyan);
    line-height: 1.6;
  }
  .screen .btn {
    margin-top: 20px; padding: 12px 24px;
    font-family: 'Press Start 2P', monospace; font-size: 12px;
    background: transparent; border: 2px solid var(--neon-green);
    color: var(--neon-green); cursor: pointer;
    text-shadow: 0 0 5px var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
    transition: all 0.2s;
  }
  .screen .btn:hover {
    background: var(--neon-green); color: var(--dark-bg);
    box-shadow: 0 0 20px var(--neon-green);
  }

  .glitch { animation: glitch 1s infinite; }
  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
  }

  #mobile-controls {
    display: none; position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 50; gap: 8px;
    flex-direction: column;
    align-items: center;
  }
  .dpad-row { display: flex; gap: 8px; }
  .dpad-btn {
    width: 60px; height: 60px;
    border: 2px solid var(--neon-cyan);
    background: rgba(0, 255, 255, 0.1);
    color: var(--neon-cyan); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    touch-action: manipulation;
  }
  .dpad-btn:active {
    background: rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 20px var(--neon-cyan);
  }

  @media (max-width: 768px) {
    #mobile-controls { display: flex; }
    .screen h1 { font-size: 16px; }
    .screen p { font-size: 8px; }
    #hud { font-size: 10px; }
  }

  #audio-toggle {
    position: absolute;
    top: 10px; right: 10px; z-index: 30;
    background: transparent; border: 1px solid var(--neon-purple);
    color: var(--neon-purple);
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    padding: 4px 8px; cursor: pointer;
    text-shadow: 0 0 5px var(--neon-purple);
  }

  #audio-visualizer {
    position: absolute;
    bottom: 10px; left: 10px; right: 10px;
    height: 20px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    z-index: 10;
    pointer-events: none;
    opacity: 0.6;
  }
  .viz-bar {
    width: 4px;
    background: var(--neon-green);
    box-shadow: 0 0 5px var(--neon-green);
    transition: height 0.05s ease;
    border-radius: 2px 2px 0 0;
  }
</style>
</head>
<body class="crt">

  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="hud">
      <div><span class="label">SCORE</span> <span class="value" id="score">0</span></div>
      <div><span class="label">HIGH</span> <span class="value" id="high">0</span></div>
      <div><span class="label">LEVEL</span> <span class="value" id="level">1</span></div>
    </div>

    <div id="audio-visualizer"></div>

    <button id="audio-toggle">AUDIO: ON</button>

    <div id="start-screen" class="screen">
      <h1 class="glitch">NEON SNAKE</h1>
      <p>CYBERPUNK PROTOCOL v2.0</p>
      <p style="color:var(--neon-green); margin-top:10px;">ARROWS / WASD to Move</p>
      <p style="color:var(--neon-green);">SPACE to Pause</p>
      <p style="color:var(--neon-purple); margin-top:10px;">Eat data. Grow strong.</p>
      <p>Don't crash the system.</p>
      <button class="btn" id="start-btn">INITIALIZE</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <h1 style="color:var(--neon-yellow); text-shadow:0 0 10px var(--neon-yellow);">SYSTEM CRASH</h1>
      <p>FINAL SCORE: <span id="final-score" style="color:var(--neon-pink);">0</span></p>
      <p>MAX LEVEL: <span id="final-level" style="color:var(--neon-cyan);">1</span></p>
      <button class="btn" id="restart-btn">REBOOT</button>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="dpad-row"><div class="dpad-btn" data-dir="up">&#9650;</div></div>
    <div class="dpad-row">
      <div class="dpad-btn" data-dir="left">&#9664;</div>
      <div class="dpad-btn" data-dir="down">&#9660;</div>
      <div class="dpad-btn" data-dir="right">&#9654;</div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // ===== AUDIO ENGINE v2 - Cyberpunk Synthwave =====
  const AudioEngine = {
    ctx: null,
    enabled: true,
    masterGain: null,
    bgmInterval: null,
    bgmStep: 0,
    bgmNotes: [],
    nextNoteTime: 0,
    tempo: 0.15,

    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.4;
        this.masterGain.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    toggle() {
      this.enabled = !this.enabled;
      if (!this.enabled) {
        this.stopBGM();
      } else {
        this.startBGM();
      }
      return this.enabled;
    },

    // C-major cyberpunk bass arpeggio + retro pad
    startBGM() {
      if (!this.enabled || !this.ctx) return;
      this.stopBGM();
      this.bgmStep = 0;
      this.nextNoteTime = this.ctx.currentTime + 0.1;
      this.bgmNotes = [
        { freq: 65.41, type: 'sawtooth', duration: 0.3, gain: 0.15 },   // C2
        { freq: 98.00, type: 'sawtooth', duration: 0.3, gain: 0.12 },   // G2
        { freq: 130.81, type: 'square', duration: 0.25, gain: 0.08 },   // C3
        { freq: 82.41, type: 'sawtooth', duration: 0.3, gain: 0.14 },  // E2
        { freq: 110.00, type: 'square', duration: 0.25, gain: 0.08 },   // A2
        { freq: 73.42, type: 'sawtooth', duration: 0.3, gain: 0.13 },   // D2
        { freq: 87.31, type: 'sawtooth', duration: 0.3, gain: 0.12 },  // F2
        { freq: 123.47, type: 'square', duration: 0.25, gain: 0.08 }, // B2
      ];
      this.scheduleNextNote();
    },

    scheduleNextNote() {
      if (!this.enabled || !this.ctx) return;
      const note = this.bgmNotes[this.bgmStep % this.bgmNotes.length];
      const time = this.nextNoteTime;
      
      // Bass synth
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();
      
      osc.type = note.type;
      osc.frequency.value = note.freq;
      
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, time);
      filter.frequency.exponentialRampToValueAtTime(200, time + note.duration);
      
      gain.gain.setValueAtTime(note.gain, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + note.duration);
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.masterGain);
      
      osc.start(time);
      osc.stop(time + note.duration);
      
      // Hi-hat noise (every other note)
      if (this.bgmStep % 2 === 0) {
        const hatGain = this.ctx.createGain();
        hatGain.gain.setValueAtTime(0.06, time);
        hatGain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        
        const hatFilter = this.ctx.createBiquadFilter();
        hatFilter.type = 'highpass';
        hatFilter.frequency.value = 8000;
        
        const hatOsc = this.ctx.createOscillator();
        hatOsc.type = 'square';
        hatOsc.frequency.value = 1000;
        hatOsc.connect(hatFilter);
        hatFilter.connect(hatGain);
        hatGain.connect(this.masterGain);
        hatOsc.start(time);
        hatOsc.stop(time + 0.05);
      }
      
      this.bgmStep++;
      this.nextNoteTime += this.tempo;
      
      const delay = Math.max(0, (this.nextNoteTime - this.ctx.currentTime) * 1000 - 50);
      this.bgmInterval = setTimeout(() => this.scheduleNextNote(), delay);
    },

    stopBGM() {
      if (this.bgmInterval) {
        clearTimeout(this.bgmInterval);
        this.bgmInterval = null;
      }
    },

    playEat() {
      if (!this.enabled || !this.ctx) return;
      const time = this.ctx.currentTime;
      
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, time);
      osc.frequency.exponentialRampToValueAtTime(1760, time + 0.1);
      gain.gain.setValueAtTime(0.3, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(time);
      osc.stop(time + 0.15);
    },

    playDie() {
      if (!this.enabled || !this.ctx) return;
      const time = this.ctx.currentTime;
      
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, time);
      osc.frequency.exponentialRampToValueAtTime(50, time + 0.6);
      gain.gain.setValueAtTime(0.4, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.6);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(time);
      osc.stop(time + 0.6);
      
      // Second noise burst
      const noise = this.ctx.createOscillator();
      const noiseGain = this.ctx.createGain();
      noise.type = 'square';
      noise.frequency.value = 50;
      noiseGain.gain.setValueAtTime(0.2, time + 0.3);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
      noise.connect(noiseGain);
      noiseGain.connect(this.masterGain);
      noise.start(time + 0.3);
      noise.stop(time + 0.5);
    },

    playLevelUp() {
      if (!this.enabled || !this.ctx) return;
      const time = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      
      notes.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.25, time + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, time + i * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time + i * 0.12);
        osc.stop(time + i * 0.12 + 0.25);
      });
    },

    playStart() {
      if (!this.enabled || !this.ctx) return;
      const time = this.ctx.currentTime;
      const arpeggio = [261.63, 329.63, 392.00, 523.25];
      
      arpeggio.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, time + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, time + i * 0.1 + 0.3);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time + i * 0.1);
        osc.stop(time + i * 0.1 + 0.3);
      });
    }
  };

  // ===== PARTICLE SYSTEM =====
  class Particle {
    constructor(x, y, color, speed, life) {
      this.x = x; this.y = y; this.color = color;
      this.vx = (Math.random() - 0.5) * speed;
      this.vy = (Math.random() - 0.5) * speed;
      this.life = life; this.maxLife = life;
      this.size = Math.random() * 4 + 2;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--; this.size *= 0.96;
    }
    draw(ctx) {
      const alpha = this.life / this.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
      ctx.restore();
    }
  }
  const particles = [];

  function spawnExplosion(x, y, color, count = 30) {
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, color, 8, 40 + Math.random() * 20));
    }
  }

  function spawnTrail(x, y, color) {
    if (Math.random() < 0.3) {
      particles.push(new Particle(x, y, color, 2, 20));
    }
  }

  // ===== VISUALIZER =====
  const visualizer = document.getElementById('audio-visualizer');
  for (let i = 0; i < 20; i++) {
    const bar = document.createElement('div');
    bar.className = 'viz-bar';
    bar.style.height = '2px';
    visualizer.appendChild(bar);
  }

  function updateVisualizer() {
    if (!AudioEngine.enabled || !running) {
      document.querySelectorAll('.viz-bar').forEach(bar => bar.style.height = '2px');
      return;
    }
    document.querySelectorAll('.viz-bar').forEach((bar, i) => {
      const height = Math.random() * 15 + 2;
      bar.style.height = height + 'px';
      bar.style.background = i % 3 === 0 ? 'var(--neon-pink)' : 
                            i % 3 === 1 ? 'var(--neon-cyan)' : 'var(--neon-green)';
    });
  }
  setInterval(updateVisualizer, 100);

  // ===== GAME ENGINE =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('game-container');
  const TILE_COUNT = 20;
  let CELL_SIZE = 20;

  function resize() {
    const maxW = window.innerWidth - 40;
    const maxH = window.innerHeight - 180;
    const size = Math.min(maxW, maxH, 600);
    CELL_SIZE = Math.floor(size / TILE_COUNT);
    const canvasSize = CELL_SIZE * TILE_COUNT;
    canvas.width = canvasSize;
    canvas.height = canvasSize;
    container.style.width = canvasSize + 'px';
    container.style.height = canvasSize + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  let snake = [];
  let direction = { x: 0, y: 0 };
  let nextDirection = { x: 0, y: 0 };
  let food = { x: 10, y: 10 };
  let score = 0;
  let highScore = parseInt(localStorage.getItem('neonSnakeHigh')) || 0;
  let level = 1;
  let speed = 150;
  let lastTime = 0;
  let accumulator = 0;
  let running = false;
  let paused = false;
  let screenShake = 0;
  let foodPulse = 0;
  let snakeGlow = 0;

  document.getElementById('high').textContent = highScore;

  function resetGame() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0; level = 1; speed = 150; screenShake = 0;
    spawnFood();
    updateHUD();
  }

  function spawnFood() {
    let valid = false;
    while (!valid) {
      food.x = Math.floor(Math.random() * TILE_COUNT);
      food.y = Math.floor(Math.random() * TILE_COUNT);
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
  }

  function setDirection(dx, dy) {
    if (!running || paused) return;
    if (direction.x === -dx && direction.y === -dy) return;
    if (snake.length > 1 && snake[0].x + dx === snake[1].x && snake[0].y + dy === snake[1].y) return;
    nextDirection = { x: dx, y: dy };
  }

  function update(dt) {
    if (!running || paused) return;
    accumulator += dt;
    if (accumulator >= speed) {
      accumulator -= speed;
      direction = { ...nextDirection };
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      if (head.x < 0) head.x = TILE_COUNT - 1;
      if (head.x >= TILE_COUNT) head.x = 0;
      if (head.y < 0) head.y = TILE_COUNT - 1;
      if (head.y >= TILE_COUNT) head.y = 0;
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10 * level;
        AudioEngine.playEat();
        spawnExplosion(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, '#fff700', 35);
        screenShake = 10;
        spawnFood();
        const newLevel = Math.floor(score / 50) + 1;
        if (newLevel > level) {
          level = newLevel;
          speed = Math.max(50, 150 - (level - 1) * 10);
          AudioEngine.playLevelUp();
          screenShake = 18;
        }
      } else {
        snake.pop();
      }
      updateHUD();
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    foodPulse += dt * 0.005;
    snakeGlow += dt * 0.003;
    if (screenShake > 0) screenShake *= 0.88;
    if (screenShake < 0.5) screenShake = 0;
  }

  function draw() {
    ctx.save();
    if (screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }
    ctx.fillStyle = '#050505';
    ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

    ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= TILE_COUNT; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL_SIZE, 0); ctx.lineTo(i * CELL_SIZE, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL_SIZE); ctx.lineTo(canvas.width, i * CELL_SIZE); ctx.stroke();
    }

    const pulse = Math.sin(foodPulse) * 0.3 + 0.7;
    const fx = food.x * CELL_SIZE;
    const fy = food.y * CELL_SIZE;
    ctx.save();
    ctx.fillStyle = '#fff700';
    ctx.shadowBlur = 25 * pulse;
    ctx.shadowColor = '#fff700';
    const fsize = CELL_SIZE * 0.7 * pulse;
    const fpad = (CELL_SIZE - fsize) / 2;
    ctx.fillRect(fx + fpad, fy + fpad, fsize, fsize);
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 15;
    ctx.fillRect(fx + fpad + fsize * 0.25, fy + fpad + fsize * 0.25, fsize * 0.5, fsize * 0.5);
    ctx.restore();

    snake.forEach((s, i) => {
      const sx = s.x * CELL_SIZE;
      const sy = s.y * CELL_SIZE;
      const isHead = i === 0;
      ctx.save();
      const glow = isHead ? 20 + Math.sin(snakeGlow) * 8 : 8;
      const alpha = 1 - (i / snake.length) * 0.5;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = isHead ? '#00ffff' : `hsl(${120 + (i / snake.length) * 60}, 100%, 50%)`;
      ctx.shadowBlur = glow;
      ctx.shadowColor = i < 3 ? '#00ffff' : '#39ff14';
      const pad = isHead ? 1 : 2;
      ctx.fillRect(sx + pad, sy + pad, CELL_SIZE - pad * 2, CELL_SIZE - pad * 2);
      if (isHead) {
        ctx.fillStyle = '#ff00ff';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff00ff';
        const eyeSize = CELL_SIZE * 0.2;
        ctx.fillRect(sx + CELL_SIZE * 0.25, sy + CELL_SIZE * 0.25, eyeSize, eyeSize);
        ctx.fillRect(sx + CELL_SIZE * 0.55, sy + CELL_SIZE * 0.25, eyeSize, eyeSize);
      }
      ctx.restore();
      if (!isHead) spawnTrail(sx + CELL_SIZE/2, sy + CELL_SIZE/2, '#39ff14');
    });

    particles.forEach(p => p.draw(ctx));
    ctx.restore();
  }

  function gameOver() {
    running = false;
    AudioEngine.playDie();
    AudioEngine.stopBGM();
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('neonSnakeHigh', highScore);
      document.getElementById('high').textContent = highScore;
    }
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-level').textContent = level;
    document.getElementById('gameover-screen').classList.remove('hidden');
  }

  function startGame() {
    AudioEngine.init();
    AudioEngine.playStart();
    setTimeout(() => AudioEngine.startBGM(), 400);
    resetGame();
    running = true; paused = false;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(timestamp) {
    if (!running) return;
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ===== CONTROLS =====
  document.addEventListener('keydown', e => {
    switch(e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
      case ' ':
        if (running) {
          paused = !paused;
          if (!paused) { lastTime = performance.now(); requestAnimationFrame(loop); }
        }
        e.preventDefault();
        break;
    }
  });

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const handler = (e) => {
      e.preventDefault();
      const [dx, dy] = map[dir];
      setDirection(dx, dy);
      if (!running && !document.getElementById('start-screen').classList.contains('hidden')) {
        startGame();
      }
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  });

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  document.getElementById('audio-toggle').addEventListener('click', () => {
    const on = AudioEngine.toggle();
    document.getElementById('audio-toggle').textContent = 'AUDIO: ' + (on ? 'ON' : 'OFF');
    if (!on) {
      document.querySelectorAll('.viz-bar').forEach(bar => bar.style.height = '2px');
    }
  });

  // Initial draw
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
})();
</script>
</body>
</html>
