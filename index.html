<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON SNAKE // CYBERPUNK PROTOCOL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --neon-pink: #ff00ff;
    --neon-cyan: #00ffff;
    --neon-green: #39ff14;
    --neon-yellow: #fff700;
    --neon-purple: #bc13fe;
    --dark-bg: #050505;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background: var(--dark-bg);
    color: var(--neon-cyan);
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }

  /* CRT Overlay */
  .crt::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(
      rgba(18, 16, 16, 0) 50%,
      rgba(0, 0, 0, 0.25) 50%
    ), linear-gradient(
      90deg,
      rgba(255, 0, 0, 0.06),
      rgba(0, 255, 0, 0.02),
      rgba(0, 0, 255, 0.06)
    );
    background-size: 100% 2px, 3px 100%;
    z-index: 100;
    pointer-events: none;
    animation: flicker 0.15s infinite;
  }

  .crt::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
    z-index: 101;
    pointer-events: none;
  }

  @keyframes flicker {
    0% { opacity: 0.97; }
    50% { opacity: 1; }
    100% { opacity: 0.98; }
  }

  /* Game Container */
  #game-container {
    position: relative;
    border: 2px solid var(--neon-cyan);
    box-shadow:
      0 0 10px var(--neon-cyan),
      0 0 20px var(--neon-cyan),
      inset 0 0 20px rgba(0,255,255,0.1);
    border-radius: 4px;
    background: rgba(5, 5, 5, 0.9);
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    text-shadow: 0 0 5px var(--neon-cyan);
    z-index: 10;
    pointer-events: none;
  }

  #hud .label { color: var(--neon-pink); }
  #hud .value { color: var(--neon-yellow); }

  /* Screens */
  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 5, 5, 0.92);
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  .screen.hidden { display: none; }

  .screen h1 {
    font-size: 24px;
    margin-bottom: 20px;
    text-shadow:
      0 0 5px var(--neon-pink),
      0 0 10px var(--neon-pink),
      0 0 20px var(--neon-pink);
    color: var(--neon-pink);
    line-height: 1.5;
  }
  .screen p {
    font-size: 10px;
    margin: 8px 0;
    color: var(--neon-cyan);
    line-height: 1.6;
  }
  .screen .btn {
    margin-top: 20px;
    padding: 12px 24px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: transparent;
    border: 2px solid var(--neon-green);
    color: var(--neon-green);
    cursor: pointer;
    text-shadow: 0 0 5px var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
    transition: all 0.2s;
  }
  .screen .btn:hover {
    background: var(--neon-green);
    color: var(--dark-bg);
    box-shadow: 0 0 20px var(--neon-green);
  }

  .glitch {
    animation: glitch 1s infinite;
  }
  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
  }

  /* Mobile Controls */
  #mobile-controls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    gap: 8px;
    flex-direction: column;
    align-items: center;
  }
  .dpad-row { display: flex; gap: 8px; }
  .dpad-btn {
    width: 60px; height: 60px;
    border: 2px solid var(--neon-cyan);
    background: rgba(0, 255, 255, 0.1);
    color: var(--neon-cyan);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    touch-action: manipulation;
  }
  .dpad-btn:active {
    background: rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 20px var(--neon-cyan);
  }

  @media (max-width: 768px) {
    #mobile-controls { display: flex; }
    .screen h1 { font-size: 16px; }
    .screen p { font-size: 8px; }
    #hud { font-size: 10px; }
  }

  #audio-toggle {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 30;
    background: transparent;
    border: 1px solid var(--neon-purple);
    color: var(--neon-purple);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 4px 8px;
    cursor: pointer;
    text-shadow: 0 0 5px var(--neon-purple);
  }
</style>
</head>
<body class="crt">

  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="hud">
      <div><span class="label">SCORE</span> <span class="value" id="score">0</span></div>
      <div><span class="label">HIGH</span> <span class="value" id="high">0</span></div>
      <div><span class="label">LEVEL</span> <span class="value" id="level">1</span></div>
    </div>

    <button id="audio-toggle">AUDIO: ON</button>

    <div id="start-screen" class="screen">
      <h1 class="glitch">NEON SNAKE</h1>
      <p>CYBERPUNK PROTOCOL v1.0</p>
      <p style="color:var(--neon-green); margin-top:10px;">ARROWS / WASD to Move</p>
      <p style="color:var(--neon-green);">SPACE to Pause</p>
      <p style="color:var(--neon-purple); margin-top:10px;">Eat data. Grow strong.</p>
      <p>Don't crash the system.</p>
      <button class="btn" id="start-btn">INITIALIZE</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <h1 style="color:var(--neon-yellow); text-shadow:0 0 10px var(--neon-yellow);">SYSTEM CRASH</h1>
      <p>FINAL SCORE: <span id="final-score" style="color:var(--neon-pink);">0</span></p>
      <p>MAX LEVEL: <span id="final-level" style="color:var(--neon-cyan);">1</span></p>
      <button class="btn" id="restart-btn">REBOOT</button>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="dpad-row"><div class="dpad-btn" data-dir="up">&#9650;</div></div>
    <div class="dpad-row">
      <div class="dpad-btn" data-dir="left">&#9664;</div>
      <div class="dpad-btn" data-dir="down">&#9660;</div>
      <div class="dpad-btn" data-dir="right">&#9654;</div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // ===== AUDIO ENGINE (Web Audio API) =====
  const AudioEngine = {
    ctx: null,
    enabled: true,
    bgmOscillators: [],
    bgmGain: null,
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    toggle() {
      this.enabled = !this.enabled;
      if (!this.enabled) { this.stopBGM(); } else { this.startBGM(); }
      return this.enabled;
    },
    startBGM() {
      if (!this.enabled || !this.ctx) return;
      this.stopBGM();
      const now = this.ctx.currentTime;
      const notes = [65.41, 73.42, 82.41, 98.00];
      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.value = 0.08;
      this.bgmGain.connect(this.ctx.destination);

      notes.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.bgmGain);
        osc.start();
        const step = 0.25;
        const pattern = [0, 2, 1, 3, 2, 0, 3, 1];
        let time = now;
        pattern.forEach((idx, p) => {
          if (idx === i) {
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + step * 0.9);
          }
          time += step;
        });
        const loop = () => {
          let t = this.ctx.currentTime;
          pattern.forEach((idx) => {
            if (idx === i) {
              gain.gain.setValueAtTime(0.3, t);
              gain.gain.exponentialRampToValueAtTime(0.01, t + step * 0.9);
            }
            t += step;
          });
        };
        osc.loopInterval = setInterval(loop, step * pattern.length * 1000);
        this.bgmOscillators.push({ osc, gain, interval: osc.loopInterval });
      });

      const noise = this.createNoise();
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.value = 0.02;
      noise.connect(noiseGain);
      noiseGain.connect(this.bgmGain);
      noise.start();
      this.bgmOscillators.push({ osc: noise, gain: noiseGain });
    },
    stopBGM() {
      this.bgmOscillators.forEach(o => {
        try { o.osc.stop(); } catch(e){}
        if (o.interval) clearInterval(o.interval);
      });
      this.bgmOscillators = [];
    },
    createNoise() {
      const bufferSize = this.ctx.sampleRate * 2;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;
      return noise;
    },
    playEat() {
      if (!this.enabled || !this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    },
    playDie() {
      if (!this.enabled || !this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.5);
    },
    playLevelUp() {
      if (!this.enabled || !this.ctx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.12 + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + i * 0.12);
        osc.stop(this.ctx.currentTime + i * 0.12 + 0.2);
      });
    }
  };

  // ===== PARTICLE SYSTEM =====
  class Particle {
    constructor(x, y, color, speed, life) {
      this.x = x; this.y = y; this.color = color;
      this.vx = (Math.random() - 0.5) * speed;
      this.vy = (Math.random() - 0.5) * speed;
      this.life = life; this.maxLife = life;
      this.size = Math.random() * 4 + 2;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life--; this.size *= 0.96;
    }
    draw(ctx) {
      const alpha = this.life / this.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
      ctx.restore();
    }
  }

  const particles = [];
  function spawnExplosion(x, y, color, count = 20) {
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, color, 6, 40 + Math.random() * 20));
    }
  }
  function spawnTrail(x, y, color) {
    if (Math.random() < 0.4) {
      particles.push(new Particle(x, y, color, 1, 15));
    }
  }

  // ===== GAME =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('game-container');

  const TILE_COUNT = 20;
  let CELL_SIZE = 20;

  function resize() {
    const maxW = window.innerWidth - 40;
    const maxH = window.innerHeight - 180;
    const size = Math.min(maxW, maxH, 600);
    CELL_SIZE = Math.floor(size / TILE_COUNT);
    const canvasSize = CELL_SIZE * TILE_COUNT;
    canvas.width = canvasSize;
    canvas.height = canvasSize;
    container.style.width = canvasSize + 'px';
    container.style.height = canvasSize + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  let snake = [];
  let direction = { x: 0, y: 0 };
  let nextDirection = { x: 0, y: 0 };
  let food = { x: 10, y: 10 };
  let score = 0;
  let highScore = parseInt(localStorage.getItem('neonSnakeHigh')) || 0;
  let level = 1;
  let speed = 150;
  let lastTime = 0;
  let accumulator = 0;
  let running = false;
  let paused = false;
  let screenShake = 0;
  let foodPulse = 0;
  let snakeGlow = 0;

  document.getElementById('high').textContent = highScore;

  function resetGame() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0; level = 1; speed = 150; screenShake = 0;
    spawnFood(); updateHUD();
  }

  function spawnFood() {
    let valid = false;
    while (!valid) {
      food.x = Math.floor(Math.random() * TILE_COUNT);
      food.y = Math.floor(Math.random() * TILE_COUNT);
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
  }

  function setDirection(dx, dy) {
    if (!running || paused) return;
    if (direction.x === -dx && direction.y === -dy) return;
    if (snake.length > 1 && snake[0].x + dx === snake[1].x && snake[0].y + dy === snake[1].y) return;
    nextDirection = { x: dx, y: dy };
  }

  function update(dt) {
    if (!running || paused) return;
    accumulator += dt;

    if (accumulator >= speed) {
      accumulator -= speed;
      direction = { ...nextDirection };

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0) head.x = TILE_COUNT - 1;
      if (head.x >= TILE_COUNT) head.x = 0;
      if (head.y < 0) head.y = TILE_COUNT - 1;
      if (head.y >= TILE_COUNT) head.y = 0;

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10 * level;
        AudioEngine.playEat();
        spawnExplosion(food.x * CELL_SIZE + CELL_SIZE / 2, food.y * CELL_SIZE + CELL_SIZE / 2, '#fff700', 30);
        screenShake = 8;
        spawnFood();
        const newLevel = Math.floor(score / 50) + 1;
        if (newLevel > level) {
          level = newLevel;
          speed = Math.max(60, 150 - (level - 1) * 8);
          AudioEngine.playLevelUp();
          screenShake = 15;
        }
      } else {
        snake.pop();
      }
      updateHUD();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }

    foodPulse += dt * 0.005;
    snakeGlow += dt * 0.003;
    if (screenShake > 0) screenShake *= 0.9;
    if (screenShake < 0.5) screenShake = 0;
  }

  function draw() {
    ctx.save();
    if (screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }
    ctx.fillStyle = '#050505';
    ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

    ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= TILE_COUNT; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL_SIZE, 0); ctx.lineTo(i * CELL_SIZE, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL_SIZE); ctx.lineTo(canvas.width, i * CELL_SIZE); ctx.stroke();
    }

    const pulse = Math.sin(foodPulse) * 0.3 + 0.7;
    const fx = food.x * CELL_SIZE;
    const fy = food.y * CELL_SIZE;
    ctx.save();
    ctx.fillStyle = '#fff700';
    ctx.shadowBlur = 20 * pulse;
    ctx.shadowColor = '#fff700';
    const fsize = CELL_SIZE * 0.7 * pulse;
    const fpad = (CELL_SIZE - fsize) / 2;
    ctx.fillRect(fx + fpad, fy + fpad, fsize, fsize);
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.fillRect(fx + fpad + fsize * 0.25, fy + fpad + fsize * 0.25, fsize * 0.5, fsize * 0.5);
    ctx.restore();

    snake.forEach((seg, i) => {
      const isHead = i === 0;
      const sx = seg.x * CELL_SIZE;
      const sy = seg.y * CELL_SIZE;
      const glow = Math.sin(snakeGlow + i * 0.5) * 0.3 + 0.7;
      if (!isHead && Math.random() < 0.05) {
        spawnTrail(sx + CELL_SIZE / 2, sy + CELL_SIZE / 2, i < 3 ? '#00ffff' : '#39ff14');
      }
      ctx.save();
      if (isHead) {
        ctx.fillStyle = '#00ffff';
        ctx.shadowBlur = 15 * glow;
        ctx.shadowColor = '#00ffff';
      } else {
        const t = i / snake.length;
        ctx.fillStyle = i < 3 ? '#00ffff' : `rgb(${Math.floor(57 + t * 100)}, ${Math.floor(255 - t * 100)}, ${Math.floor(20 + t * 50)})`;
        ctx.shadowBlur = 8 * glow;
        ctx.shadowColor = i < 3 ? '#00ffff' : '#39ff14';
      }
      const pad = isHead ? 1 : 2;
      ctx.fillRect(sx + pad, sy + pad, CELL_SIZE - pad * 2, CELL_SIZE - pad * 2);
      if (isHead) {
        ctx.fillStyle = '#ff00ff';
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#ff00ff';
        const eyeSize = CELL_SIZE * 0.2;
        ctx.fillRect(sx + CELL_SIZE * 0.25, sy + CELL_SIZE * 0.25, eyeSize, eyeSize);
        ctx.fillRect(sx + CELL_SIZE * 0.55, sy + CELL_SIZE * 0.25, eyeSize, eyeSize);
      }
      ctx.restore();
    });

    particles.forEach(p => p.draw(ctx));
    ctx.restore();
  }

  function gameOver() {
    running = false;
    AudioEngine.playDie();
    AudioEngine.stopBGM();
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('neonSnakeHigh', highScore);
      document.getElementById('high').textContent = highScore;
    }
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-level').textContent = level;
    document.getElementById('gameover-screen').classList.remove('hidden');
  }

  function startGame() {
    AudioEngine.init();
    AudioEngine.startBGM();
    resetGame();
    running = true; paused = false;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(timestamp) {
    if (!running) return;
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', e => {
    switch(e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
      case ' ':
        if (running) {
          paused = !paused;
          if (!paused) { lastTime = performance.now(); requestAnimationFrame(loop); }
        }
        e.preventDefault();
        break;
    }
  });

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const handler = (e) => {
      e.preventDefault();
      const [dx, dy] = map[dir];
      setDirection(dx, dy);
      if (!running && !document.getElementById('start-screen').classList.contains('hidden')) {
        startGame();
      }
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  });

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  document.getElementById('audio-toggle').addEventListener('click', () => {
    const on = AudioEngine.toggle();
    document.getElementById('audio-toggle').textContent = 'AUDIO: ' + (on ? 'ON' : 'OFF');
  });

  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
})();
</script>
</body>
</html>
